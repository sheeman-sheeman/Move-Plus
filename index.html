<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f3ec">
  <meta name="description" content="動いた日も、整える日も。運動と体調を自分のペースで記録する Move Plus。">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Move Plus">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <title>Move Plus — 自分のリズムを記録する</title>
</head>
<body>
  <a class="skip-link" href="#main-content">メインコンテンツへ</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="アプリメニュー">
      <a class="brand" href="#today" data-view-link="today" aria-label="Move Plus ホーム">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none">
            <path d="M8 25.5c5.1 0 6.2-11 11.3-11s6.2 11 11.3 11" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
            <path d="M9 31c5.1 0 6.2-11 11.3-11s6.2 11 11.3 11" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" opacity=".58"/>
          </svg>
        </span>
        <span class="brand-copy">
          <strong>MOVE PLUS</strong>
          <small>YOUR DAILY RHYTHM</small>
        </span>
      </a>

      <p class="nav-caption">WORKSPACE</p>
      <nav class="primary-nav" aria-label="メインナビゲーション">
        <button class="nav-item is-active" type="button" data-view="today" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v13H4zM8 3v5M16 3v5M4 10h16M8 14h3"/></svg>
          <span>今日の記録</span>
          <span class="nav-indicator" aria-hidden="true"></span>
        </button>
        <button class="nav-item" type="button" data-view="review">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h17M7.5 15l3.5-4 3 2 5-6"/></svg>
          <span>振り返り</span>
        </button>
        <button class="nav-item" type="button" data-view="menus">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16M8 4v4M16 10v4M10 16v4"/></svg>
          <span>運動メニュー</span>
        </button>
      </nav>

      <div class="sidebar-bottom">
        <div class="local-note">
          <span class="local-indicator" aria-hidden="true"></span>
          <span><strong>端末内に保存</strong><small>あなたのブラウザーだけ</small></span>
        </div>
        <button class="nav-item settings-link" type="button" data-view="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 15 .1.1 1.4 1.1-1.5 2.6-1.7-.6a7.9 7.9 0 0 1-1.5.9l-.3 1.8h-3l-.3-1.8a7.9 7.9 0 0 1-1.5-.9l-1.7.6-1.5-2.6 1.4-1.1a7.6 7.6 0 0 1 0-1.8l-1.4-1.1 1.5-2.6 1.7.6a7.9 7.9 0 0 1 1.5-.9l.3-1.8h3l.3 1.8a7.9 7.9 0 0 1 1.5.9l1.7-.6 1.5 2.6-1.4 1.1a7.6 7.6 0 0 1 0 1.8Z"/></svg>
          <span>設定・データ</span>
        </button>
      </div>
    </aside>

    <div class="main-column">
      <header class="mobile-header">
        <a class="brand" href="#today" data-view-link="today" aria-label="Move Plus ホーム">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 40 40" fill="none">
              <path d="M8 25.5c5.1 0 6.2-11 11.3-11s6.2 11 11.3 11" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
              <path d="M9 31c5.1 0 6.2-11 11.3-11s6.2 11 11.3 11" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" opacity=".58"/>
            </svg>
          </span>
          <span class="brand-copy"><strong>MOVE PLUS</strong><small>YOUR DAILY RHYTHM</small></span>
        </a>
        <span class="mobile-date" id="mobile-date"></span>
      </header>

      <main id="main-content" class="main-content" tabindex="-1"></main>
    </div>
  </div>

  <nav class="mobile-nav" aria-label="メインナビゲーション">
    <button class="mobile-nav-item is-active" type="button" data-view="today" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v13H4zM8 3v5M16 3v5M4 10h16M8 14h3"/></svg><span>記録</span>
    </button>
    <button class="mobile-nav-item" type="button" data-view="review">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h17M7.5 15l3.5-4 3 2 5-6"/></svg><span>振り返り</span>
    </button>
    <button class="mobile-nav-item" type="button" data-view="menus">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16M8 4v4M16 10v4M10 16v4"/></svg><span>メニュー</span>
    </button>
    <button class="mobile-nav-item" type="button" data-view="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.3"/><path d="m19 14.8 1.3 1-1.5 2.6-1.6-.6a7.4 7.4 0 0 1-1.4.8l-.3 1.7h-3l-.3-1.7a7.4 7.4 0 0 1-1.4-.8l-1.6.6-1.5-2.6 1.3-1a7 7 0 0 1 0-1.6l-1.3-1 1.5-2.6 1.6.6a7.4 7.4 0 0 1 1.4-.8l.3-1.7h3l.3 1.7a7.4 7.4 0 0 1 1.4.8l1.6-.6 1.5 2.6-1.3 1a7 7 0 0 1 0 1.6Z"/></svg><span>設定</span>
    </button>
  </nav>

  <dialog class="menu-dialog" id="menu-dialog" aria-labelledby="dialog-title">
    <form id="menu-form" class="dialog-form">
      <div class="dialog-head">
        <div>
          <p class="eyebrow">YOUR MOVEMENT</p>
          <h2 id="dialog-title">運動メニューを追加</h2>
        </div>
        <button class="icon-button" type="button" data-action="close-dialog" aria-label="閉じる">×</button>
      </div>
      <input type="hidden" name="id" id="menu-id">
      <label class="field-label" for="menu-name">種目名</label>
      <input class="text-input" type="text" name="name" id="menu-name" maxlength="50" placeholder="例：スクワット" required>
      <div class="form-grid">
        <div>
          <label class="field-label" for="menu-reps">1セットの回数</label>
          <div class="input-with-unit"><input class="text-input" type="number" name="reps" id="menu-reps" min="1" max="999" inputmode="numeric" required><span>回</span></div>
        </div>
        <div>
          <label class="field-label" for="menu-sets">目標セット数</label>
          <div class="input-with-unit"><input class="text-input" type="number" name="targetSets" id="menu-sets" min="1" max="30" inputmode="numeric" required><span>セット</span></div>
        </div>
      </div>
      <p class="dialog-note">目標はあとからいつでも変更できます。記録済みの内容は変わりません。</p>
      <div class="dialog-actions">
        <button class="button button-quiet" type="button" data-action="close-dialog">キャンセル</button>
        <button class="button button-primary" type="submit">保存する</button>
      </div>
    </form>
  </dialog>

  <input id="import-file" type="file" accept=".json,application/json" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./script.js"></script>
</body>
</html>
